# this is antarans' resources calculation delay; antarans don't attack during first two calculation cycles,
# so for real attack delay add +2*calc frequency
ai antaran_fleet growth_delay prewarp = 105;
ai antaran_fleet growth_delay average = 90;
ai antaran_fleet growth_delay advanced = 15;
ai antaran_fleet resource_growth frequency = 5; # frequency in turns at which antarans production is recalculated;
# this is random roll value; if roll is lower than number of turns since last attack, attack happens; default was 200;
ai antaran_fleet attack roll_range = 5;
# in order attack to happen, antaran attack force should meet the following condition:
# 2^this number*A >>= A + D + Ra + Rd, where A is cost of all produced Attack ships,
# D -  cost of all Defense ships, Ra - attack production resources, Rd - defense production resoruces;
ai antaran_fleet attack minimum_offensive_force_shift = 3;
ai antaran_fleet resource_growth offensive_multiplier normal = 100;
ai antaran_fleet resource_growth offensive_multiplier hard = 200;
ai antaran_fleet resource_growth offensive_multiplier impossible = 300;
ai antaran_fleet resource_growth defensive_multiplier normal = 100;
ai antaran_fleet resource_growth defensive_multiplier hard = 200;
ai antaran_fleet resource_growth defensive_multiplier impossible = 300;

