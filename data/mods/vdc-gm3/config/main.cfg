# ===================== #
# --   INTERFACE     -- #
# ===================== #

interface vsync_enabled = false; # if 1, faster screen changes.
interface screen_fade_speed = 25; # fade in and fade out speds for switching screens.
interface scroll_interval = 2; # scroll delay in combat in ticks (about 18 ticks per seconds)
interface wormhole_link_color = 4; # specifies color for wormholes.
interface warn_blockers = false; # if 1, warning for housing, trade goods or repeat builds in queue.
interface history_graph_smoothing = false; # history graphs will not be smoothened.

# Controls if a new ship design is added best available shield automatically. Options are: 'update', 'intact';
design design_button_shield = update;
# Controls if a new ship design is added best available computer automatically. Options are: 'update', 'intact';
design design_button_computer = update;
# Controls how CLEAR button in design screen behaves in regard to shield. Options are: 'intact', 'update', 'clear';
design clear_button_shield = update;
# Controls how CLEAR button in design screen behaves in regard to computer. Options are: 'intact', 'update', 'clear';
design clear_button_computer = intact;

interface keep_end_of_turn_wait_in_multiplayer = true; # if 1, end of turn wait setting is preserved, even in MP game.
research finds_presented_by_scientist = true; # if 1, scientist instead of trooper presents arti planet tech finds.
# possible values: classic, accumulated, print_research_value = accumulated;  ;  remaining = 2x cost -
# accumulated_research for current project- empire_research generated this turn;
interface print_research_value = remaining;
interface no_outpost_prompt = false; # if 1, outpost landing prompt upon arrival at a system is skipped.
# if 1, disables game asking to select an initial technology, however it affects AI - it sometimes  doesn't start
# research;
interface initial_tech_prompt = true;
# ship designs are not automatically rebuilt when the physics tech field becomes known;
design rebuild_ship_designs_after_field physics = false;

 # Although boarding marines popup windows and combat confirmation popup window could be set for local machine
 # independently, it is strongly recommended that you keep current settings;
interface confirm_battle_message_timeout = 75; # timeout for confirmation of battle popup in deciseconds.
# auto closes attack confirmation pop-up; also auto close of outpost destruction, ground invasion and mindcontrol
# confirmation pop-up was added;
combat boarding auto_close_results = true;

interface format mod_name =
    template: "$MOD$"
    style: 2
    align: r
    x: 590
    y: 400; # title screen; position of version number.
interface format version =
    template: "Patch Version: $VERSION$"
    style: 2
    align: r
    x: 590
    y: 415; # title screen; position of config name.

interface format prod =
    template: "$TURNS$ turns"
    style: 1
    align: r
    x: 627
    y: 103;
interface format prod2 =
    template: "$TOTAL_PROD$ of $PRODUCT_COST$  $TURNS$ turns"
    style: 1
    align: r
    x: 627
    y: 103;

# ------------------------------------------------------------------------------------------------------------------ #
# ---------[ GROUND RULES ]------------------------------------------------------ #
# -------------------------------------------------------------------------#

game start population = 8;
game start money = 75;
game starting_ships = true; # removes scouts and colony ship from average and post-warp games;
colony freighters_cash_bonus = 5; # 5 BC compensation for producing freighter is original behaviour;
colony starting_outpost_ship = true; # adds an outpost to starting fleet on average tech level game setup;
# allows colony to starve below 1 pop after which it may dissapear; 1- on ; 0- off (original behaviour);
colony planet_extinction = false;
# new refit formula = minimal cost (25% of hull cost)+ shipcost difference (when diff is positive);
design alternative_refit = true;
economy ship_scrap_refund_percent = double; # scrapping ships gives 50% of the cost instead of 25%;
# allows player to hire unlimited number of leaders; 1- on; 0- off (original behaviour);
leaders leaders_no_limit = true;
# allows colony to build multiple items per turn (up to 7 items by means of filling all queue);
colony multibuild = false;
colony allow_last_population_transfer = true; # allows to send the last unit of population from a colony;
colony native_population_transfer = true; # allows to move native population from one colony to another;
colony max_pop_freighted = 60; # number of max freighted pop can be set (was 25);

research fixed_cost = true; # removes random roll aspect from tech breakthrough;
# Research points won't be lost when the researched item was acquired in other way;
research keep_research_on_finds = true;
# Research points above double cost won't be lost, but will be carried over to the next item;
research keep_research_on_breakthrough = false;

# is set 0 for VDC; provides instant immobilization for all kind of weapons and recalculation of ship's combat stats
# within combat round, e.g. recalc of stats happens after each shot;
combat interactive_combat_stats = false;
# ship initiative = 1 forces ship initiative mode even if opponent doesn't have ship initiative box checked;  if 2
# strict combat sequencing is enabled - one wait for each ship per combat round and move order regulated in a strict
# way - exactly like in heroes3 - order of movement of ships pressed wait button becomes backward, i.e the ship with
# highest ini moves the last;
combat ship_initiative = 1;
combat phasing_cloak_decloak_defense = true; # Phasing Cloak has BD/ME bonus immediately after decloaking;
# Tractor Beam and BHG insta-stop target, but unlike interactive combat stats mode target doesn't remobilize instantly
# when it gets released;
combat non_ics_tractor_and_bhg_mode = true;

detection stealth_size_penalty = race_tech; # Defines to which stealth types detection -> size penalty does not apply:
                                                          # none      - size penalty applies both to stealthy races and
                                                          # stealth techs, i.e size penalty affects detection;
                                                          # race      - no size penalty for stealthy races, but aplies
                                                          # to techs (1.50 default);
                                                          # race_tech - no size penalty for stealthy races and stealth
                                                          # tech (140 default).


# fires normal beams at enemy ships in auto regime as soon as enemy gets into Defensive Fire Range (DFR); defensive
# fire works starting from round 1 from now on;
combat defensive_fire = true;
# uses static values of probability of fire for differnet ranges instead of DFR, check values at 'Combat Bonuses'
# below;
combat alternate_defensive_fire = true;

# if 0 prevents ships gaining extra speed from battle pods AND additionally decreases speed of the ships to minimal
# speed when the loading exceeds initial hull space; 1 - original behaviour; 0- enabling this option;
design battle_pods_speed_bonus = true;
# auxilary parameter for battle_pods_speed_bonus, which can decrease speed of battlepodded ships further than minimal
# speed of the hull (when the loading exceeds initial hull space, but uses battlepods space);
design minimum_combat_speed = 255;
                                  #  set the minimum speed here;  255-no change;

colony transport_ship_extended_range = true; #  marine transports are added extended fuel tanks like outposts;

gameplay council first_meeting_delay = 75; # Default is 25, maximum is 127;
ai surrender_delay = 150; # Turn after which AI's can surrender their Empires.
ai alternate_diplomacy = true; # enables separate diplomacy patience counters.

score victory_bonus orion = 100;
score victory_bonus antares = 300;
score victory_bonus council = 200;

combat max_turns = 25;
# if 1, human player fleet can retreat on AUTOcombat according to the same rules of AI.
combat human_fleet_auto_retreat = false;
# in autocombat mode, ships that have no weapons or are out of ammo do not retreat from combat;
combat ships_without_ammo_stay = true;

# ---------[ COLONY MICROMANAGEMENT ]-------------------------------------------------------------- #

# If 1, first pop on a new colony always becomes a worker, if 0 first pop becomes a farmer on food worlds, unless your
# race is cybernetic or lithovore;
colony first_pop_to_production = true;
# Value of the base food per farmer on a colony that must be exceeded for a new population unit to be assigned to
# farming;
colony new_farmer_food_threshold = 2;
colony housing_creates_no_farmers = true;

