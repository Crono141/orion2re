# ===================== #
# -- COMMAND LINE    -- #
# ===================== #

# By putting 1 instead of 0 you activate the switch.
# For explanation of switches refer to http://moo2mod.com/mapgen.html

diplomacy noreport = true; # Forbids the Report button and Exchange, Demand, and Offer Technology.
combat disable_scan = false;
colony androids_available = false;
colony disable_housing = false;

map specials generate_splinter_colonies = false;
map home_system minimum_planets = 5;
map specials generate_wormholes = false;
map specials generate_black_holes = false;
map specials generate_nebulas = false;
map specials generate_orion = false;
# value 255 for monsters switch turns it off (255 means random number); set monsters = 0 for no monster map.
map monsters count = 255;

map home_system use_fixed_unoccupied_planets = true;
map home_system improve_fourth_unoccupied_planet = true;
map planets normalize_low_gravity = true;
map specials replace_splinter_colonies_with_gems = true;
map specials artifacts_grant_technology = false;
map monsters improve_guarded_planets = true;
map specials remove_marooned_heroes = true; # activating -smarooned removes all marooned leaders from the map.
map specials highlight_marooned_heroes = false;
map starting_reveal_radius = 12;

#Unused switches (can enable by putting 1 instead of 0):
map home_system minimum_starting_planet_production = false;
map home_system rich_starting_planet = false;
map home_system huge_starting_planet = false;
map home_system ultra_rich_starting_planet = false;
map planets convert_toxic_to_radiated = false;
map planets improve_ultra_poor_minerals = false;
map planets upgrade_tiny_planets = false;
map home_system normalize_unoccupied_planets = false;
map planets normalize_heavy_gravity = false;
map planets upgrade_small_planets = false;
map home_system make_first_unoccupied_planet_rich = false;
map home_system make_first_unoccupied_planet_huge = false;
map home_system improve_first_unoccupied_planet = false;
map specials replace_natives_with_gold = false;
map monsters recalculate_guarded_planet_gravity = false;
map monsters terraform_guarded_natives = false;

