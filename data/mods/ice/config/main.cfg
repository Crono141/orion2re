# ===================== #
# --    LBX FILES    -- #
# ===================== #

# lbx REQUIRED for patch
# estrings.lbx provided updated leader-hire and Titan mind-control text.
# The replacement is supplied by the package VFS.

# lbx graphics
# combat.lbx   = \150\lbx\COMBAT.LBX;     # graphics: greyed WAIT button.     (provided by the package VFS)
# design.lbx   = \150\lbx\DESIGN.LBX;     # graphics: x3 missile shots.       (provided by the package VFS)
# info.lbx     = \150\lbx\INFO.LBX;       # set only if info_lbx_menu = ice;  (provided by the package VFS)
# shipname.lbx = \150\lbx\SHIPNAME.LBX;   # modded ship names.                (provided by the package VFS)

# lbx text multilingual
# kentext.lbx  = ?..\lbx\KENTEXT.LBX;     # -25 negative picks and 8 mutation picks.  (provided by the package VFS)

# lbx text language specific
# credits.lbx  = ?..\lbx\en\CREDITS.LBX;  # EN: new title screen credits.          (provided by the package VFS)
# help.lbx     = ?..\lbx\en\HELP.LBX;     # EN: updated help texts for ICE.        (provided by the package VFS)
# herodata.lbx = ?..\lbx\en\HERODATA.LBX; # EN: updated leaders for ICE.           (provided by the package VFS)
# techdesc.lbx = ?..\lbx\en\TECHDESC.LBX; # EN: updated design dock descriptions.  (provided by the package VFS)

