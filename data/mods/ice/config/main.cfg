colony androids_available = false;
colony disable_housing = false;
combat disable_scan = false;
interface allow_future_technology_browsing = true;

game start population = 8;
game start marines = 3;
game start money = 50;

game starting_ships = true;
colony starting_outpost_ship = false;
colony transport_ship_extended_range = false;

colony first_pop_to_production = true; # first pop on a new colony always becomes a worker.
colony new_farmer_food_threshold = 2; # base food per farmer above which a new-pop is assigned to farming.
colony housing_creates_no_farmers = true; # new-pop on housing colony is never assigned to farming.

colony multibuild = false; # option for melee mod.
design alternative_refit = true; # Max((new_cost - old_cost), 0) + 1/4 standard hull cost.
economy ship_scrap_refund_percent = classic; #
colony freighters_cash_bonus = 0; # Was 5 in classic & 1.40, but since v1.40 there's no t0 maintenance cost.

# Carry accumulated RP above twice the current technology's cost into the next field.
research keep_research_on_breakthrough = true;
# Do not reset RP when the current technology is acquired from artifacts, capture, or spying.
research keep_research_on_finds = true;
research fixed_cost = false; # If enabled, no %chance for breakthrough.
research menlo_cheat_points = 100000;
leaders orion_reward_technology application = death_ray;
leaders loknar_gives_no_tech = false;
design rebuild_ship_designs_after_field physics = false; # no auto ship design rebuild when the Physics field is given.

score victory_bonus orion = 100;
score victory_bonus antares = 250;
score victory_bonus council = 200; # 100

